name: Repository gate

# 流程门禁（docs/README.md）：结构 / CI 约定 / 文档链接 / 元数据 / 身份哈希 / 版本一致性 / 公开文件卫生。
# 只做可机检的事实检查，不代替审计与实机测试，也不产生交付结论。

on:
  push:
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "metadata/**"
      - "tools/**"
      - "Auditor/**"
      - "Tester/**"
      - "Developer/**"
      - ".github/workflows/repository-gate.yml"
      - "kernel_img/offset_harness/**"
      - "*/Makefile"
      - "kpm_utils.h"
      - ".agents/**"
  pull_request:
  workflow_dispatch:

jobs:
  Gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Tool parity self-test (regressions for past findings)
        run: python3 tools/selftest_tools.py

      - name: Tester script self-test (mock device, no hardware needed)
        run: bash Tester/tools/selftest_scripts.sh

      - name: Repository gate
        run: python3 tools/check_repository.py

name: Build CI

on:
  push:
    paths:
      - ".github/workflows/build-kpm.yml"
      - "**.c"

  workflow_dispatch:
    inputs:
      release:
        description: "Push a new release"
        required: false
        default: "false"
      version:
        description: "release version"
        required: false
        default: "2024051900"

jobs:
  Build-on-Ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: UTC-8

    outputs:
      kpm_list: ${{ steps.list-kpms.outputs.kpm_list }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: Update system and install dependencies
        run: |
          sudo apt update -y
          sudo apt install llvm -y

      - name: Build kpm
        run: |
          mkdir target

          # 只构建「有 Makefile 且未被 archive 标记」的顶层目录：
          #   * 没有 Makefile 的目录（文档/工具/用户数据/子模块）天然跳过，无需任何标记；
          #   * 有 Makefile 但不想让它进 CI 的模块目录，放一个空的 archive 文件。
          for dir in */; do
            if [ -f "${dir}archive" ]; then
              echo "skip ${dir} (archive)"
              continue
            fi
            if [ ! -f "${dir}Makefile" ]; then
              continue
            fi
            echo "build ${dir}"
            if [ "${dir%/}" = "re_kernel_x" ]; then
              make -C "${dir}" baselines
              mv "${dir}"*.kpm "${dir}"*.kpm.json target
            else
              make -C "${dir}"
              mv "${dir}"*.kpm target
            fi
          done

      - name: Generate kpm list
        id: list-kpms
        run: |
          kpms=$(ls target/*.kpm | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
          echo "kpm_list=${kpms}" >> "${GITHUB_OUTPUT}"

      - name: Upload target for matrix jobs
        uses: actions/upload-artifact@v7
        with:
          name: all_kpms
          path: target

      - name: Prepare release baselines
        if: github.event.inputs.release == 'true'
        run: |
          mkdir release
          shopt -s nullglob
          for abi in 3 4 5 6; do
            baselines=(target/re_kernel_x_*_abi${abi}.kpm)
            test "${#baselines[@]}" -eq 1
            test -f "${baselines[0]}.json"
            cp "${baselines[0]}" "${baselines[0]}.json" release/
          done

      - name: Upload release
        if: github.event.inputs.release == 'true'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          artifacts: "release/*"
          allowUpdates: true
          generateReleaseNotes: true
          makeLatest: true
          omitBodyDuringUpdate: true
          replacesArtifacts: true

  Upload-artifacts:
    needs: Build-on-Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        kpm: ${{ fromJson(needs.Build-on-Ubuntu.outputs.kpm_list) }}

    steps:
      - name: Download target
        uses: actions/download-artifact@v8
        with:
          name: all_kpms

      - name: Upload ${{ matrix.kpm }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kpm }}
          path: ${{ matrix.kpm }}
          archive: false

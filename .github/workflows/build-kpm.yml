name: Build CI

on:
  push:
    paths:
      - ".github/workflows/build-kpm.yml"
      - "tools/artifact_gate.py"
      - "tools/selftest_artifact_gate.py"
      - "tools/selftest_offset_modes.py"
      - "patch_offsets.py"
      - "**/*.c"
      - "**/*.h"
      - "**/*.S"
      - "**/*.s"
      - "**/*.mk"
      - "**/Makefile"
      - "**/archive"
      - "re_kernel_x/tools/**"
      - "nomount/module/**"
      - "nomount/README.md"
      - "nomount/tools/**"
      - "nomount/upstream/nomount"
      - "zram_zstd/upstream/zstd"
      - "KernelPatch"
      - ".gitmodules"

  pull_request:
    paths:
      - ".github/workflows/build-kpm.yml"
      - "tools/artifact_gate.py"
      - "tools/selftest_artifact_gate.py"
      - "tools/selftest_offset_modes.py"
      - "patch_offsets.py"
      - "**/*.c"
      - "**/*.h"
      - "**/*.S"
      - "**/*.s"
      - "**/*.mk"
      - "**/Makefile"
      - "**/archive"
      - "re_kernel_x/tools/**"
      - "nomount/module/**"
      - "nomount/README.md"
      - "nomount/tools/**"
      - "nomount/upstream/nomount"
      - "zram_zstd/upstream/zstd"
      - "KernelPatch"
      - ".gitmodules"

  workflow_dispatch:
    inputs:
      release:
        description: "Push a new release"
        required: false
        default: "false"
      version:
        description: "release version"
        required: false
        default: "2024051900"

jobs:
  Build-on-Ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: UTC-8

    outputs:
      kpm_list: ${{ steps.list-kpms.outputs.kpm_list }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: Update system and install dependencies
        run: |
          sudo apt update -y
          sudo apt install llvm -y

      - name: Artifact gate regression tests
        run: |
          python3 tools/selftest_artifact_gate.py
          python3 tools/selftest_release_assets.py
          python3 tools/selftest_offset_modes.py

      - name: Build kpm
        run: |
          mkdir target

          # 只构建「有 Makefile 且未被 archive 标记」的顶层目录：
          #   * 没有 Makefile 的目录（文档/工具/用户数据/子模块）天然跳过，无需任何标记；
          #   * 有 Makefile 但不想让它进 CI 的模块目录，放一个空的 archive 文件。
          for dir in */; do
            if [ -f "${dir}archive" ]; then
              echo "skip ${dir} (archive)"
              continue
            fi
            if [ ! -f "${dir}Makefile" ]; then
              continue
            fi
            echo "build ${dir}"
            printf "%s\n" "${dir%/}" >> target/modules.txt
            if [ "${dir%/}" = "re_kernel_x" ] || [ "${dir%/}" = "re_kernel" ] || [ "${dir%/}" = "run_cmd_demo" ] || [ "${dir%/}" = "zram_zstd" ] || [ "${dir%/}" = "nomount" ]; then
              make -C "${dir}" all
              if grep -Eq '^debug[[:space:]]*:' "${dir}Makefile"; then
                make -C "${dir}" debug
              fi
              mv "${dir}"*.kpm "${dir}"*.kpm.json target
            else
              make -C "${dir}"
              mv "${dir}"*.kpm target
            fi
          done

      - name: Validate compiled artifacts
        run: python3 tools/artifact_gate.py target --modules target/modules.txt

      - name: Generate kpm list
        id: list-kpms
        run: |
          kpms=$(ls target/*.kpm | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
          echo "kpm_list=${kpms}" >> "${GITHUB_OUTPUT}"

      - name: Upload target for matrix jobs
        uses: actions/upload-artifact@v7
        with:
          name: all_kpms
          path: target

      - name: Prepare release assets
        if: github.event.inputs.release == 'true'
        run: |
          mkdir release
          shopt -s nullglob
          for kpm in target/*.kpm; do
            case "${kpm##*/}" in
              re_kernel_x_*|*_debug.kpm) continue ;;
            esac
            cp "${kpm}" release/
            if [ -f "${kpm}.json" ]; then
              cp "${kpm}.json" release/
            fi
          done
          statics=(target/re_kernel_x_*_baselines.kpm)
          dynamics=()
          for kpm in target/re_kernel_x_[0-9]*.kpm; do
            case "${kpm##*/}" in
              *_baselines.kpm|*_debug.kpm) continue ;;
            esac
            dynamics+=("${kpm}")
          done
          if [ "${#statics[@]}" -gt 0 ]; then
            test "${#statics[@]}" -eq 1
            test "${#dynamics[@]}" -eq 1
            test -f "${statics[0]}.json"
            test ! -e "${dynamics[0]}.json"
            cp "${statics[0]}" "${statics[0]}.json" "${dynamics[0]}" release/
          else
            baselines=()
            for kpm in target/re_kernel_x_*.kpm; do
              case "${kpm##*/}" in
                *_debug.kpm) continue ;;
              esac
              baselines+=("${kpm}")
            done
            test "${#baselines[@]}" -eq 1
            test -f "${baselines[0]}.json"
            cp "${baselines[0]}" "${baselines[0]}.json" release/
          fi
          for module in re_kernel run_cmd_demo; do
            statics=(target/${module}_[0-9]*_baselines.kpm)
            dynamics=()
            for kpm in target/${module}_[0-9]*.kpm; do
              case "${kpm##*/}" in
                *_baselines.kpm|*_debug.kpm) continue ;;
              esac
              dynamics+=("${kpm}")
            done
            if [ "${#statics[@]}" -gt 0 ] || [ "${#dynamics[@]}" -gt 0 ]; then
              test "${#statics[@]}" -eq 1
              test "${#dynamics[@]}" -eq 1
            fi
          done
          python3 tools/artifact_gate.py release --modules target/modules.txt

      - name: Upload prepared KPM release assets
        if: github.event.inputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release_kpms
          path: release

  Upload-artifacts:
    needs: Build-on-Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        kpm: ${{ fromJson(needs.Build-on-Ubuntu.outputs.kpm_list) }}

    steps:
      - name: Download target
        uses: actions/download-artifact@v8
        with:
          name: all_kpms

      - name: Verify downloaded artifact hashes
        run: sha256sum --check SHA256SUMS

      - name: Upload ${{ matrix.kpm }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kpm }}
          path: ${{ matrix.kpm }}
          archive: false

  Build-NoMount-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: Setup Java for Android SDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install ZIP toolchain
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;26.3.11579264"
          log-accepted-android-sdk-licenses: false

      - name: Check ZIP publishing
        run: |
          python3 nomount/tools/test_release_zip.py
          python3 nomount/tools/test_update_json.py

      - name: Build NoMount ZIP
        id: build_zip
        run: |
          mkdir -p local
          python3 nomount/tools/build_zip.py --ndk "$ANDROID_HOME/ndk/26.3.11579264" --host-tag linux-x86_64 > local/nomount-zip-result.json
          python3 nomount/tools/release_zip.py prepare --result local/nomount-zip-result.json --output target_zip
          (cd target_zip && sha256sum --check SHA256SUMS)
          python3 -c 'import json; print("zip_name=" + json.load(open("local/nomount-zip-result.json"))["artifact"]["name"])' >> "$GITHUB_OUTPUT"

      - name: Upload ZIP and build identity
        uses: actions/upload-artifact@v7
        with:
          name: nomount_zip
          path: target_zip

      - name: Upload versioned NoMount ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_zip.outputs.zip_name }}
          path: target_zip/${{ steps.build_zip.outputs.zip_name }}
          archive: false

  Publish-release:
    needs: [Build-on-Ubuntu, Build-NoMount-zip]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@v6

      - name: Download prepared KPM assets
        uses: actions/download-artifact@v8
        with:
          name: release_kpms
          path: release

      - name: Download NoMount ZIP
        uses: actions/download-artifact@v8
        with:
          name: nomount_zip
          path: target_zip

      - name: Verify and combine release assets
        env:
          RELEASE_TAG: ${{ github.event.inputs.version }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          (cd target_zip && sha256sum --check SHA256SUMS)
          python3 nomount/tools/release_zip.py merge --zip-dir target_zip --release-dir release --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          (cd release && sha256sum --check SHA256SUMS)

      - name: Select release uploads
        run: |
          # 只上传用户需要的资产；构建清单与校验和留在 CI 侧。
          mkdir upload
          shopt -s nullglob
          for kpm in release/*.kpm; do
            cp "$kpm" upload/
            if [ -f "${kpm}.json" ]; then
              cp "${kpm}.json" upload/
            fi
          done
          companion=(release/NoMount-kpm_*.zip)
          test "${#companion[@]}" -eq 1
          cp "${companion[0]}" upload/
          test -f release/NoMount-kpm.json
          cp release/NoMount-kpm.json upload/

      - name: Upload release
        if: github.event.inputs.release == 'true'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          artifacts: "upload/*"
          commit: ${{ github.sha }}
          artifactErrorsFailBuild: true
          immutableCreate: true
          allowUpdates: false
          generateReleaseNotes: true
          makeLatest: true
